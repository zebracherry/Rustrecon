[package]
name = "rustrecon"
version = "0.1.0"
edition = "2021"
description = "OSCP async recon framework"

[[bin]]
name = "rustrecon"
path = "src/main.rs"

[dependencies]
tokio     = { version = "=1.36.0", features = ["full"] }
clap      = { version = "=4.4.18", features = ["derive"] }
serde     = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
regex     = "=1.10.3"
chrono    = { version = "=0.4.35", features = ["serde"] }
colored   = "=2.1.0"
anyhow    = "=1.0.80"
which     = "=4.4.2"

[dependencies.home]
version = "=0.5.5"

